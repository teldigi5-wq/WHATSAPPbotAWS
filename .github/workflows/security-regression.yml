name: Security regression checks
on:
  pull_request:
  push:
    branches:
      - security/private-roster-pairing-guard-20261021
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check bot.js
      - run: node --check security/setup-access.js
      - run: node --test tests/*.test.js
      - name: Block committed private roster
        run: |
          test ! -e students.json
          test ! -e eac-groups.json
          ! grep -Eq 'const EAC_GROUPS = \{' bot.js
