name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: whatsappbotaws-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Node.js service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check bot.js
          node --check ecosystem.config.js
          node --check security/media-response.js

      - name: Validate JSON data files
        run: |
          test ! -e students.json
          test ! -e eac-groups.json
          node -e "JSON.parse(require('fs').readFileSync('timetable.json','utf8')); console.log('timetable.json valid')"
          node --test tests/*.test.js

      - name: Validate setup script syntax
        run: bash -n setup.sh

      - name: Verify required project files
        run: |
          test -f bot.js
          test -f package.json
          test -f package-lock.json
          test -f ecosystem.config.js
          test -f setup.sh

      - name: Generate verifiable remediation lockfile for review
        shell: bash
        run: |
          set -euo pipefail
          cd .
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo 'Additional vulnerabilities require review'
          node - <<'NODE'
          const fs=require('node:fs');
          const b64=fs.readFileSync('package-lock.json').toString('base64');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          console.log('REMEDIATION_VERSIONS='+JSON.stringify(Object.fromEntries(['body-parser','axios','follow-redirects','sharp','proxy-addr','qs','electron','electron-builder','vite','tar'].map(n=>[n,lock.packages['node_modules/'+n]?.version||null]))));
          for(let i=0;i<b64.length;i+=8000) console.log('REMEDIATION_LOCK_CHUNK_'+String(i/8000).padStart(4,'0')+'='+b64.slice(i,i+8000));
          console.log('REMEDIATION_LOCK_END='+Math.ceil(b64.length/8000));
          NODE

      - name: Audit production dependencies (high severity)
        run: npm audit --omit=dev --audit-level=high
